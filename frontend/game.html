<!DOCTYPE html> 
<html lang="en"> 
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="/favicon.ico" type="image/png">
    <style name="log"></style>
</head>

<body>
    <main class="card">
        <header class="header">
            <h1>Show Game</h1>
        </header>

        <pre id="log"></pre>

        <div class="buttons">
            <form method="get" action="/">
                <button type="submit" class="exit-btn"
                        formaction="/" formmethod="get" formnovalidate>
                    Exit
                </button>
            </form>
        </div>
    </main>

    <script>
        const params = new URLSearchParams(location.search);
        const code = params.get("code") || "";
        const slot = params.get("slot") || "";
        const log = document.getElementById("log");
        let since = 0;   // Index der nächsten noch nicht gesehenen Nachricht

        async function poll() {
            try {
                const url = "/api/game/" + encodeURIComponent(code) + "/output"
                          + "?slot=" + encodeURIComponent(slot) + "&since=" + since;
                const data = await (await fetch(url)).json();

                if (data.messages) {
                    if (data.messages.length > 0) {
                        // nur automatisch scrollen, wenn der Spieler schon unten war
                        const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 20;
                        // textContent statt innerHTML: Spieltexte nie als HTML interpretieren
                        log.textContent += data.messages.join("");
                        if (atBottom) log.scrollTop = log.scrollHeight;
                    }
                    since = data.next;
                }
            } catch (e) {
                // Server kurz nicht erreichbar: einfach weiter versuchen
            }
            setTimeout(poll, 500);
        }

        poll();
    </script>
</body> 
    
</html>
