<!DOCTYPE html> 
<html lang="en"> 
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Game</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="/favicon.ico" type="image/png">
</head>

<body>
    <main class="card">
        <header class="header">
            <h1>Create Your Game</h1>
            <p class="subtitle">
                Choose the amount of players, logic bots and machine learning (ML) bots. <br>
                Summed up, the amount of players must be 4!
            </p>
        </header>

        <form method="post" action="/newGame">
            <div class="settings">
                <div class="field">
                    <label for="players">Players</label>
                    <input name="players" id="players" type="number"
                           min="0" max="4" value="0" required>
                </div>

                <div class="field">
                    <label for="logic_bots">Logic Bots</label>
                    <input name="logic_bots" id="logic_bots" type="number"
                           min="0" max="4" value="0" required>
                </div>

                <div class="field">
                    <label for="ml_bots">ML Bots</label>
                    <input name="ml_bots" id="ml_bots" type="number"
                           min="0" max="4" value="0" required>
                </div>
            </div>

            <div class="buttons">
                <button type="submit" class="create-btn">
                    Create Game
                </button>

                <button type="submit" class="exit-btn"
                        formaction="/" formmethod="get" formnovalidate>
                    Exit
                </button>
            </div>
        </form>
    </main>
</body> 
    
</html>
